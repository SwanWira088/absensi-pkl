<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absen PKL</title>
  <link rel="stylesheet" href="css/absen-sementara.css">
  <script type="module" src="js/presensi.js"></script>
</head>
<body>

  <section id="boxLogin" class="layar" hidden>
    <div class="kartu login">
      <div class="logo">A</div>
      <h1>Absensi PKL</h1>
      <p class="sub">Masuk dengan akun dari admin</p>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="nama@sekolah.sch.id" autocomplete="username">

      <label for="password">Password</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="current-password">
        <button type="button" id="btnLihat" aria-label="Tampilkan atau sembunyikan password">Lihat</button>
      </div>

      <button id="btnMasuk" class="utama">Masuk</button>
      <p id="pesanLogin" class="pesan" role="status"></p>
      <p class="kecil">Lupa password? Hubungi admin</p>
    </div>
  </section>

  <main id="boxAbsen" class="layar" hidden>
    <div class="kartu">
      <h1 id="sapaan">Halo</h1>
      <p id="tanggal" class="sub"></p>
      <p id="jam" class="jam">00:00:00</p>
      <p id="status" class="badge belum">Memuat...</p>
      <p id="detailStatus" class="sub"></p>

      <button id="btnCheckIn" class="utama besar">Check-in sekarang</button>
      <button id="btnCheckOut" class="garis">Check-out</button>
      <p id="pesan" class="pesan" role="status"></p>

      <h2>Riwayat 5 hari terakhir</h2>
      <ul id="riwayat" class="riwayat"></ul>

      <button id="btnKeluar" class="teks">Keluar</button>
    </div>
  </main>

</body>
</html>
