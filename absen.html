<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absen PKL</title>
  <link rel="stylesheet" href="css/absen-sementara.css">
  <script type="module" src="js/presensi.js"></script>
  <a href="riwayat.html" class="teks">Lihat semua riwayat</a>
</head>
<body>

  <main id="boxAbsen" class="layar" hidden>
    <div class="kartu">
      <h1 id="sapaan">Halo</h1>
      <p id="tanggal" class="sub"></p>
      <p id="jam" class="jam">00:00:00</p>
      <p id="status" class="badge belum">Memuat...</p>
      <p id="detailStatus" class="sub"></p>

      <button id="btnCheckIn" class="utama besar">Check-in sekarang</button>
      <button id="btnCheckOut" class="garis">Check-out</button>
      <label for="keterangan">Keterangan izin atau sakit</label>
<input id="keterangan" type="text" placeholder="Contoh: demam, ke dokter">
<button id="btnIzin" class="garis">Izin</button>
<button id="btnSakit" class="garis">Sakit</button>
      <p id="pesan" class="pesan" role="status"></p>

      <h2>Riwayat 5 hari terakhir</h2>
      <ul id="riwayat" class="riwayat"></ul>

      <button id="btnKeluar" class="teks">Keluar</button>
    </div>
  </main>

</body>
</html>
