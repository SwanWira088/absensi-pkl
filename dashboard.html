<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
</head>
<body>
  <h1>Dashboard</h1>
  <p id="sapa"></p>
  <button id="tombol-keluar">Keluar</button>
  <script type="module">
    import { jagaHalaman, keluar } from "./js/auth.js";
    jagaHalaman(["pembimbing", "admin"], (profil) => {
      document.getElementById("sapa").textContent = "Halo, " + profil.nama;
    });
    document.getElementById("tombol-keluar").addEventListener("click", keluar);
  </script>
</body>
</html>
